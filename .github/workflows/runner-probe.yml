name: Runner Probe

on:
  push:
    branches:
      - genspark-dev
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove runner execution
        run: |
          set -eux
          echo "runner=$(uname -a)"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
