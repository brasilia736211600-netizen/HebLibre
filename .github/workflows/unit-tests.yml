name: Unit Tests

on:
  push:
    branches:
      - genspark-dev
  pull_request:
    branches:
      - genspark-dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        run: sdkmanager "platforms;android-29" "build-tools;28.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ARM APK splits
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify ARM APK outputs
        run: |
          test -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -f app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload ARM APK splits
        uses: actions/upload-artifact@v4
        with:
          name: HebLibre-debug-arm-splits
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
